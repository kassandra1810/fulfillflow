spring.application.name=platform-api

spring.datasource.url=jdbc:postgresql://localhost:5432/fulfillflow
spring.datasource.username=fulfillflow
spring.datasource.password=fulfillflow

# Schema is owned by Flyway; Hibernate only validates that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Strict JSON types for the whole API (spec, "Kontrakt API"):
# - integer fields reject non-integer numbers (a quantity of 2.5 is a 400, not a
#   silent truncation to 2); quantities are whole numbers everywhere (PRD rule 3),
# - numbers sent as JSON strings ("quantity":"5", "price":"19.90") are a 400.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
