spring.application.name=platform-api

spring.datasource.url=jdbc:postgresql://localhost:5432/fulfillflow
spring.datasource.username=fulfillflow
spring.datasource.password=fulfillflow

# Schema is owned by Flyway; Hibernate only validates that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Integer fields reject non-integer JSON (e.g. a quantity of 2.5 is a 400, not a
# silent truncation to 2); quantities are whole numbers everywhere (spec rule 3).
spring.jackson.deserialization.accept-float-as-int=false
